<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>SmaPri Print - Excel Navigator</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs/qrcode.min.js"></script>

<style>
    /* PREVIOUS STYLE PRESERVED */
    body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
        background: #f4f6f8;
        margin: 0;
        padding: 20px;
    }

    .container-wrapper {
        display: flex;
        justify-content: center;
        gap: 40px;
        flex-wrap: wrap;
        margin-top: 40px;
    }

    .container {
        max-width: 420px;
        background: #ffffff;
        padding: 24px;
        border-radius: 10px;
        box-shadow: 0 8px 24px rgba(0,0,0,0.08);
    }

    .field { margin-bottom: 16px; }
    label { display: block; font-size: 14px; margin-bottom: 6px; color: #333; font-weight: 600; }
    input { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #ccc; box-sizing: border-box; }
    
    button {
        width: 100%;
        padding: 12px;
        font-size: 16px;
        border: none;
        border-radius: 6px;
        background: #007aff;
        color: white;
        cursor: pointer;
        margin-top: 10px;
    }

    button:hover { background: #0069d9; }

    /* Excel Navigation Section */
    .nav-box {
        background: #eef2f7;
        padding: 15px;
        border-radius: 8px;
        margin-bottom: 20px;
        border: 1px dashed #007aff;
    }
    
    .nav-controls {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: 10px;
    }

    .nav-btn {
        width: auto;
        padding: 8px 15px;
        margin: 0;
        background: #6c757d;
        font-size: 14px;
    }

    #qrcode {
        background: #fff;
        padding: 20px;
        border-radius: 10px;
        box-shadow: 0 8px 24px rgba(0,0,0,0.08);
        height: fit-content;
    }
	
	/* CSS to position the dollar sign */
    .price-input-wrapper {
        position: relative;
        display: flex;
        align-items: center;
    }

    .price-input-wrapper span {
        position: absolute;
        left: 10px;
        color: #555;
        font-size: 15px;
        pointer-events: none;
    }

    .price-input-wrapper input {
        padding-left: 25px; /* Make space for the $ symbol */
    }	
</style>
</head>

<body>

<div class="container-wrapper">
    <div class="container">
        <h2>Label Print</h2>

        <div class="nav-box">
            <label>Upload Excel File</label>
            <input type="file" id="excel_file" accept=".xlsx, .xls">
            
            <div class="nav-controls">
                <button class="nav-btn" onclick="changeRow(-1)">&larr; Prev</button>
                <span id="row_info" style="font-size: 13px; color: #555;">No Data</span>
                <button class="nav-btn" onclick="changeRow(1)">Next &rarr;</button>
            </div>
        </div>

        <div class="field">
            <label>Product Name</label>
            <input id="item_name" type="text" placeholder="Item Name">
        </div>

        <div class="field">
            <label>Origin</label>
            <input id="item_origin" type="text" placeholder="Country">
        </div>

        <div class="field">
            <label>SKU / Batch</label>
            <input id="item_batch" type="text" placeholder="AM26220116">
        </div>

		<div class="field">
			<label for="item_price">Base Price</label>
			<div class="price-input-wrapper">
				<span>$</span>
				<input id="item_price" type="number" step="0.01" placeholder="0.00">
			</div>
		</div>

        <button onclick="printLabel()">Print Label</button>
    </div>

    <div id="qrcode"></div>
</div>

<script>
let excelData = [];
let currentIndex = -1;

function generateDynamicBatch() {
    const now = new Date();
    
    const ampm = now.getHours() >= 12 ? 'PM' : 'AM';
    const year = String(now.getFullYear()).slice(-2); // Last 2 digits
    const day = String(now.getDate()).padStart(2, '0');
    const month = String(now.getMonth() + 1).padStart(2, '0');
    const hour = String(now.getHours()).padStart(2, '0');

    // Result format: AM26220116 (AM + Year + Day + Month + Hour)
    return `${ampm}${year}${day}${month}${hour}`;
}

// Handle File Upload
document.getElementById('excel_file').addEventListener('change', function(e) {
    const file = e.target.files[0];
    const reader = new FileReader();
    reader.onload = function(evt) {
        const data = new Uint8Array(evt.target.result);
        const workbook = XLSX.read(data, {type: 'array'});
        const sheet = workbook.Sheets[workbook.SheetNames[0]];
		// This ensures formatted text is captured for the price
		excelData = XLSX.utils.sheet_to_json(sheet, { raw: false });
        
        if (excelData.length > 0) {
            currentIndex = 0;
            updateFields();
        }
    };
    reader.readAsArrayBuffer(file);
});

// Navigate Rows
function changeRow(step) {
    if (excelData.length === 0) return;
    let nextIdx = currentIndex + step;
    if (nextIdx >= 0 && nextIdx < excelData.length) {
        currentIndex = nextIdx;
        updateFields();
    }
}

// Map Excel to Form
function updateFields() {
    const row = excelData[currentIndex];
	
	// Debugging: Log the row to console to see the exact key names
    console.log("Current Row Data:", row);
	
	
    document.getElementById("item_name").value = row["Product Name"] || "";
    document.getElementById("item_origin").value = row["Country of Origin"] || "";
    document.getElementById("item_batch").value = generateDynamicBatch();
    // document.getElementById("item_price").value = row["Base Price"] || "0.00";
	let rawPrice = row["Base Price"];
	let cleanPrice = String(rawPrice).replace(/[^0-9.]/g, '');
	console.log("cleanPrice:", cleanPrice);
	document.getElementById("item_price").value = cleanPrice
    
    document.getElementById("row_info").innerText = `Row ${currentIndex + 1} of ${excelData.length}`;
}

// Static QR Code Initialization
new QRCode(document.getElementById("qrcode"), {
    text: "https://wingsato.github.io/smapri/smapri_excel.html",
    width: 200,
    height: 200
});

// SmaPri Print Logic
function isIOS() { return /iPhone|iPad|iPod/i.test(navigator.userAgent); }

function printLabel() {
    const formatUrl = "https://raw.githubusercontent.com/wingsato/smapri/main/smarpi-NTUC-test.spfmtz";
    const params = "__format_id_number=1" +
        "&__format_archive_url=" + encodeURIComponent(formatUrl) +
        "&item_name="   + encodeURIComponent(document.getElementById("item_name").value) +
        "&item_origin=" + encodeURIComponent(document.getElementById("item_origin").value) +
        "&item_batch="  + encodeURIComponent(document.getElementById("item_batch").value) +
        "&item_price="  + encodeURIComponent(document.getElementById("item_price").value);

    const url = isIOS() ? "smapri:/Format/Print?" + params : "http://localhost:8080/Format/Print?" + params;
    window.location.href = url;
}
</script>

</body>
</html>
